<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conociendo Costa Rica</title>
<meta name="description" content="Un mapa de cantones para pintar los lugares de Costa Rica que ya pisaste y ver cuáles te faltan.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D2B33'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23F2A93B'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

<style>
  :root{
    --mar:#0D2B33;        /* el océano alrededor del país */
    --mar-2:#12353F;      /* panel lateral */
    --tierra:#1C4551;     /* tierra sin explorar */
    --trama:#2C6272;      /* rayitas de la niebla */
    --mango:#F2A93B;      /* lo que ya pisaste */
    --mango-claro:#FFC567;
    --hueso:#EAE6D8;
    --hueso-tenue:#9DB4B8;
    --linea:rgba(234,230,216,.14);
    --display:'Bricolage Grotesque', system-ui, sans-serif;
    --mono:'DM Mono', ui-monospace, Menlo, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--mar);
    color:var(--hueso);
    font:400 15px/1.45 var(--display);
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{ outline:2px solid var(--mango-claro); outline-offset:2px; }

  /* ---------- estructura ---------- */
  .app{
    display:grid;
    grid-template-columns:minmax(0,1fr) 380px;
    height:100vh; height:100dvh;
  }
  .mapa-wrap{ position:relative; min-height:0; }
  #mapa{ position:absolute; inset:0; background:var(--mar); }
  .panel{
    background:var(--mar-2);
    border-left:1px solid var(--linea);
    overflow-y:auto;
    padding:28px 24px 20px;
    display:flex; flex-direction:column; gap:22px;
  }

  /* ---------- encabezado ---------- */
  .eyebrow{
    margin:0 0 10px;
    font:500 11px/1 var(--mono);
    letter-spacing:.14em; text-transform:uppercase;
    color:var(--hueso-tenue);
  }
  h1{
    margin:0;
    font-family:var(--display);
    font-size:clamp(38px,5vw,48px);
    line-height:.9;
    letter-spacing:-.015em;
    font-variation-settings:'wdth' 78, 'opsz' 96;
    font-weight:300;
  }
  h1 strong{ display:block; font-weight:800; }
  .lema{ margin:12px 0 0; color:var(--hueso-tenue); max-width:30ch; }

  /* ---------- resumen ---------- */
  .resumen{ border-top:1px solid var(--linea); padding-top:18px; }
  .resumen p{ margin:0 0 12px; font-size:17px; line-height:1.3; }
  .resumen b{ font:500 17px var(--mono); color:var(--mango); }
  .barra{
    height:8px; background:rgba(234,230,216,.1); border-radius:99px; overflow:hidden;
  }
  .barra > i{
    display:block; height:100%; width:0; background:var(--mango);
    border-radius:99px; transition:width .35s ease;
  }
  .pct{ margin-top:6px; font:400 12px var(--mono); color:var(--hueso-tenue); text-align:right; }

  /* ---------- provincias ---------- */
  .etiqueta{
    margin:0 0 8px;
    font:500 11px/1 var(--mono);
    letter-spacing:.14em; text-transform:uppercase;
    color:var(--hueso-tenue);
  }
  .prov{ border-top:1px solid var(--linea); }
  .prov:last-of-type{ border-bottom:1px solid var(--linea); }
  .prov > summary{
    list-style:none; cursor:pointer;
    display:grid; grid-template-columns:1fr auto 14px; align-items:center; gap:10px;
    padding:12px 2px 6px;
  }
  .prov > summary::-webkit-details-marker{ display:none; }
  .prov > summary::after{
    content:''; width:7px; height:7px;
    border-right:2px solid var(--hueso-tenue); border-bottom:2px solid var(--hueso-tenue);
    transform:rotate(45deg); transition:transform .2s; justify-self:end; margin-top:-3px;
    grid-column:3; grid-row:1;
  }
  .prov[open] > summary::after{ transform:rotate(-135deg); margin-top:3px; }
  .prov .nombre{ font-weight:600; font-size:16px; }
  .prov .cuenta{ font:400 12px var(--mono); color:var(--hueso-tenue); }
  .prov .mini{ grid-column:1 / -1; grid-row:2; height:4px; background:rgba(234,230,216,.1); border-radius:99px; overflow:hidden; }
  .prov .mini > i{ display:block; height:100%; width:0; background:var(--mango); transition:width .35s ease; }
  .prov.completa .nombre::after{
    content:'completa'; margin-left:8px; padding:2px 6px; border-radius:3px;
    background:var(--mango); color:var(--mar);
    font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; vertical-align:2px;
  }
  .lista{
    list-style:none; margin:0; padding:6px 0 14px;
    display:grid; grid-template-columns:1fr 1fr; gap:2px 12px;
  }
  .lista label{
    display:flex; align-items:center; gap:8px; padding:5px 2px; cursor:pointer;
    font-size:14px; color:var(--hueso);
  }
  .lista input{ accent-color:var(--mango); width:16px; height:16px; margin:0; flex:none; }
  .lista input:checked + span{ color:var(--mango-claro); }

  /* ---------- pie ---------- */
  .pie{ margin-top:auto; padding-top:8px; display:flex; flex-direction:column; gap:10px; }
  .borrar{
    align-self:flex-start; background:none; color:var(--hueso-tenue);
    border:1px solid var(--linea); border-radius:6px; padding:7px 12px;
    font:400 13px var(--display); cursor:pointer;
  }
  .borrar:hover{ color:var(--hueso); border-color:var(--hueso-tenue); }
  .creditos{ margin:0; font-size:12px; color:var(--hueso-tenue); }
  .creditos a{ color:inherit; }

  /* ---------- mapa ---------- */
  .leaflet-container{ background:var(--mar); font:inherit; }
  .canton{ fill:url(#niebla); cursor:pointer; }
  .canton.visitado{ fill:var(--mango); }
  .canton:hover{ stroke:var(--hueso); stroke-width:2px; }
  .canton.visitado:hover{ fill:var(--mango-claro); }
  .canton.sello{
    transform-box:fill-box; transform-origin:center;
    animation:sello .38s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes sello{ 0%{ transform:scale(1.07); } 100%{ transform:scale(1); } }

  .tip{
    background:var(--mar); color:var(--hueso);
    border:1px solid rgba(234,230,216,.3); border-radius:5px; box-shadow:none;
    padding:6px 9px; font:400 12px/1.35 var(--mono);
  }
  .tip::before{ display:none; }
  .tip b{ display:block; font:600 14px var(--display); }
  .tip .si{ color:var(--mango); }

  .leaflet-bar a, .leaflet-bar a:hover{
    background:var(--mar-2); color:var(--hueso); border-color:var(--linea);
  }
  .leaflet-bar a:hover{ background:var(--tierra); }
  .leaflet-control-attribution{
    background:rgba(13,43,51,.82) !important; color:var(--hueso-tenue) !important;
  }
  .leaflet-control-attribution a{ color:var(--hueso) !important; }

  .leyenda{
    position:absolute; left:14px; bottom:14px; z-index:500; pointer-events:none;
    display:flex; gap:14px; padding:8px 12px;
    background:rgba(13,43,51,.86); border:1px solid var(--linea); border-radius:6px;
    font:400 12px var(--mono); color:var(--hueso);
  }
  .leyenda span{ display:flex; align-items:center; gap:7px; }
  .leyenda i{ width:14px; height:14px; border-radius:3px; display:block; }
  .leyenda .niebla{
    background:repeating-linear-gradient(45deg, var(--tierra) 0 3px, var(--trama) 3px 4.5px);
  }
  .leyenda .pisado{ background:var(--mango); }

  .aviso{ position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; color:var(--hueso-tenue); }

  /* ---------- celular ---------- */
  @media (max-width:820px){
    .app{ display:block; height:auto; }
    .mapa-wrap{ height:62vh; height:62svh; min-height:340px; }
    .leyenda{ bottom:38px; }
    .panel{ overflow:visible; border-left:0; border-top:1px solid var(--linea); padding:24px 18px 28px; }
    .lista{ grid-template-columns:1fr 1fr; }
  }
  @media (prefers-reduced-motion:reduce){
    .canton.sello{ animation:none; }
    .barra > i, .prov .mini > i, .prov > summary::after{ transition:none; }
  }
</style>
</head>
<body>

<main class="app">
  <section class="mapa-wrap" aria-label="Mapa de cantones de Costa Rica">
    <div id="mapa"></div>
    <div class="leyenda" aria-hidden="true">
      <span><i class="niebla"></i>Por conocer</span>
      <span><i class="pisado"></i>Ya pisado</span>
    </div>
    <noscript><div class="aviso">Este mapa necesita JavaScript para funcionar.</div></noscript>
  </section>

  <aside class="panel">
    <header>
      <p class="eyebrow" id="eyebrow">Mapa de cantones</p>
      <h1>Conociendo <strong>Costa Rica</strong></h1>
      <p class="lema">Pintá de mango los cantones que ya pisaste y mirá cuáles te faltan.</p>
    </header>

    <section class="resumen" aria-live="polite">
      <p id="resumen-texto"></p>
      <div class="barra" role="progressbar" aria-label="Cantones conocidos" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barra"><i id="barra-relleno"></i></div>
      <div class="pct" id="pct">0 %</div>
    </section>

    <section>
      <h2 class="etiqueta">Por provincia</h2>
      <div id="provincias"></div>
    </section>

    <footer class="pie">
      <button type="button" class="borrar" id="borrar">Borrar mi progreso</button>
      <p class="creditos">Tu progreso se guarda solo en este navegador. Límites de cantones: <a href="https://www.geoboundaries.org/" target="_blank" rel="noopener">geoBoundaries</a> (CC0).</p>
    </footer>
  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data/cantones.js"></script>
<script src="data/provincias.js"></script>
<script>
(function () {
  'use strict';

  if (typeof L === 'undefined' || !window.CANTONES || !window.PROVINCIAS) {
    var aviso = document.createElement('div');
    aviso.className = 'aviso';
    aviso.textContent = 'No se pudo cargar el mapa. Revisá tu conexión a internet y recargá la página.';
    document.getElementById('mapa').appendChild(aviso);
    return;
  }

  var CLAVE = 'conociendo-cr:visitados:v1';
  var COLORES = { tierra: '#1C4551', trama: '#2C6272', mar: '#0D2B33', hueso: '#EAE6D8' };
  var ORDEN = ['San José', 'Alajuela', 'Cartago', 'Heredia', 'Guanacaste', 'Puntarenas', 'Limón'];
  var reducirMovimiento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- datos ---------- */
  var cantones = CANTONES.features.map(function (f) { return f.properties; });
  var TOTAL = cantones.length;
  var porProvincia = {};
  ORDEN.forEach(function (p) { porProvincia[p] = []; });
  cantones.forEach(function (c) { porProvincia[c.provincia].push(c); });
  var idsValidos = {};
  cantones.forEach(function (c) { idsValidos[c.id] = true; });

  document.getElementById('eyebrow').textContent = TOTAL + ' cantones · ' + ORDEN.length + ' provincias';

  /* ---------- progreso guardado ---------- */
  function cargar() {
    try {
      var arr = JSON.parse(localStorage.getItem(CLAVE) || '[]');
      return new Set((Array.isArray(arr) ? arr : []).filter(function (id) { return idsValidos[id]; }));
    } catch (e) { return new Set(); }
  }
  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify(Array.from(visitados))); } catch (e) { /* sin almacenamiento: sigue funcionando */ }
  }
  var visitados = cargar();

  /* ---------- mapa ---------- */
  var map = L.map('mapa', {
    zoomSnap: 0.25, zoomDelta: 0.5, wheelPxPerZoomLevel: 90,
    maxZoom: 11,
    maxBounds: [[6.2, -88.0], [12.4, -81.0]], maxBoundsViscosity: 0.85
  });
  map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  map.attributionControl.addAttribution('Límites: geoBoundaries (CC0)');
  map.fitBounds([[8.0, -85.95], [11.25, -82.55]], { padding: [14, 14] });
  map.setMinZoom(map.getZoom() - 1);

  var capas = {};   // id -> capa de Leaflet
  var checks = {};  // id -> checkbox del panel

  function textoTip(c) {
    var estado = visitados.has(c.id) ? '<span class="si">✓ ya pisado</span>' : 'por conocer';
    return '<b>' + c.nombre + '</b>' + c.provincia + ' · ' + estado;
  }

  var capaCantones = L.geoJSON(window.CANTONES, {
    style: function () {
      return { className: 'canton', weight: 1, color: COLORES.mar, opacity: 1, fill: true, fillOpacity: 1 };
    },
    onEachFeature: function (f, capa) {
      var c = f.properties;
      capas[c.id] = capa;
      capa.on('click', function () { aplicar(c.id, !visitados.has(c.id)); });
      capa.on('mouseover', function () { capa.bringToFront(); });
      capa.bindTooltip(function () { return textoTip(c); }, { sticky: true, direction: 'top', className: 'tip', opacity: 1 });
    }
  }).addTo(map);

  // la "niebla": rayitas diagonales sobre los cantones sin visitar
  var svg = map.getPanes().overlayPane.querySelector('svg');
  if (svg) {
    var NS = 'http://www.w3.org/2000/svg';
    var defs = document.createElementNS(NS, 'defs');
    defs.innerHTML =
      '<pattern id="niebla" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<rect width="7" height="7" fill="' + COLORES.tierra + '"/>' +
      '<line x1="0" y1="0" x2="0" y2="7" stroke="' + COLORES.trama + '" stroke-width="1.8"/>' +
      '</pattern>';
    svg.insertBefore(defs, svg.firstChild);
  }

  // contornos de provincia por encima, sin interceptar clics
  map.createPane('provincias').style.zIndex = 450;
  L.geoJSON(window.PROVINCIAS, {
    pane: 'provincias', interactive: false,
    style: { color: COLORES.hueso, weight: 1.6, opacity: 0.5, fill: false }
  }).addTo(map);

  /* ---------- panel ---------- */
  var contenedor = document.getElementById('provincias');
  var filas = {};   // provincia -> {details, cuenta, relleno}

  ORDEN.forEach(function (prov) {
    var det = document.createElement('details');
    det.className = 'prov';

    var sum = document.createElement('summary');
    var nombre = document.createElement('span'); nombre.className = 'nombre'; nombre.textContent = prov;
    var cuenta = document.createElement('span'); cuenta.className = 'cuenta';
    var mini = document.createElement('div'); mini.className = 'mini';
    var relleno = document.createElement('i'); mini.appendChild(relleno);
    sum.appendChild(nombre); sum.appendChild(cuenta); sum.appendChild(mini);
    det.appendChild(sum);

    var ul = document.createElement('ul'); ul.className = 'lista';
    porProvincia[prov].slice().sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); })
      .forEach(function (c) {
        var li = document.createElement('li');
        var label = document.createElement('label');
        var input = document.createElement('input'); input.type = 'checkbox';
        var texto = document.createElement('span'); texto.textContent = c.nombre;
        input.addEventListener('change', function () { aplicar(c.id, input.checked); });
        checks[c.id] = input;
        label.appendChild(input); label.appendChild(texto);
        li.appendChild(label); ul.appendChild(li);
      });
    det.appendChild(ul);
    contenedor.appendChild(det);
    filas[prov] = { details: det, cuenta: cuenta, relleno: relleno };
  });

  /* ---------- estado -> pantalla ---------- */
  function pintarResumen() {
    var n = visitados.size;
    var pct = Math.round((100 * n) / TOTAL);
    var txt = document.getElementById('resumen-texto');
    if (n === 0) {
      txt.textContent = 'Todo el país está en niebla. Tocá un cantón del mapa para empezar.';
    } else if (n === TOTAL) {
      txt.textContent = '¡Costa Rica completa! Pisaste los ' + TOTAL + ' cantones.';
    } else {
      txt.innerHTML = 'Ya pisaste <b>' + n + '</b> de ' + TOTAL + ' cantones. Te faltan <b>' + (TOTAL - n) + '</b>.';
    }
    document.getElementById('barra-relleno').style.width = pct + '%';
    document.getElementById('barra').setAttribute('aria-valuenow', String(pct));
    document.getElementById('pct').textContent = pct + ' %';
  }

  function pintarProvincias() {
    ORDEN.forEach(function (prov) {
      var lista = porProvincia[prov];
      var n = lista.filter(function (c) { return visitados.has(c.id); }).length;
      var fila = filas[prov];
      fila.cuenta.textContent = n + '/' + lista.length;
      fila.relleno.style.width = (100 * n / lista.length) + '%';
      fila.details.classList.toggle('completa', n === lista.length);
    });
  }

  function marcarVisual(id, valor, animar) {
    var el = capas[id].getElement();
    if (!el) { return; }
    el.classList.toggle('visitado', valor);
    checks[id].checked = valor;
    if (valor && animar && !reducirMovimiento) {
      el.classList.add('sello');
      el.addEventListener('animationend', function () { el.classList.remove('sello'); }, { once: true });
    }
  }

  function aplicar(id, valor) {
    if (valor) { visitados.add(id); } else { visitados['delete'](id); }
    marcarVisual(id, valor, true);
    guardar();
    pintarResumen();
    pintarProvincias();
  }

  document.getElementById('borrar').addEventListener('click', function () {
    if (visitados.size === 0) { return; }
    if (!window.confirm('¿Borrar todo tu progreso? Esto no se puede deshacer.')) { return; }
    Array.from(visitados).forEach(function (id) { marcarVisual(id, false, false); });
    visitados.clear();
    guardar();
    pintarResumen();
    pintarProvincias();
  });

  /* ---------- arranque ---------- */
  cantones.forEach(function (c) { marcarVisual(c.id, visitados.has(c.id), false); });
  pintarResumen();
  pintarProvincias();
})();
</script>
</body>
</html>
